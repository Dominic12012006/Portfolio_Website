<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-build" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121217" />
      <stop offset="50%" stop-color="#0e0e12" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d49b6a" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d49b6a" stop-opacity="0.0" />
    </linearGradient>
    <radialGradient id="glow-build" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d49b6a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-build)" />
  <rect width="100%" height="100%" fill="url(#glow-build)" />

  <!-- Subtle architectural precision lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1" fill="none">
    <line x1="80" y1="0" x2="80" y2="1200" />
    <line x1="240" y1="0" x2="240" y2="1200" />
    <line x1="400" y1="0" x2="400" y2="1200" />
    <line x1="560" y1="0" x2="560" y2="1200" />
    <line x1="720" y1="0" x2="720" y2="1200" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="800" x2="800" y2="800" />
    <line x1="0" y1="1000" x2="800" y2="1000" />
  </g>

  <!-- Technical abstract diagonal structure -->
  <path d="M 120 900 L 400 340 L 680 900 Z" stroke="rgba(212,155,106,0.18)" stroke-width="1.5" fill="none" />
  <path d="M 160 880 L 400 400 L 640 880 Z" stroke="rgba(255,255,255,0.05)" stroke-width="1" fill="none" />
  <circle cx="400" cy="340" r="4" fill="#d49b6a" opacity="0.6" />
  <line x1="400" y1="340" x2="400" y2="1050" stroke="url(#line-grad)" stroke-width="1" stroke-dasharray="4 6" />
</svg>

