<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-about" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141318" />
      <stop offset="50%" stop-color="#0e0d12" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <radialGradient id="glow-about" cx="60%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#d49b6a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-about)" />
  <rect width="100%" height="100%" fill="url(#glow-about)" />

  <!-- Concentric geometric arcs & precision coordinates -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1" fill="none">
    <circle cx="400" cy="600" r="180" />
    <circle cx="400" cy="600" r="280" stroke-dasharray="2 8" />
    <circle cx="400" cy="600" r="380" />
  </g>

  <circle cx="400" cy="600" r="120" stroke="rgba(212,155,106,0.2)" stroke-width="1.5" fill="none" />
  <circle cx="400" cy="600" r="4" fill="#d49b6a" opacity="0.6" />

  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="200" y1="600" x2="600" y2="600" />
    <line x1="400" y1="400" x2="400" y2="800" />
  </g>
</svg>

